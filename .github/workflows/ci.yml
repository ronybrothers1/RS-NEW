name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

      # Optional read-only/staging database used only for CI prerender builds.
      # If this secret is absent, lint + typecheck remain mandatory and
      # the DB-backed build step is intentionally skipped.
      CI_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      # Ephemeral CI-only value. Never used by Vercel production.
      AUTH_SECRET: "ci-only-auth-secret-do-not-use-in-production-2026"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Pin npm 11.9.0
        run: npm install --global npm@11.9.0 --no-audit --no-fund

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          node_version="$(node --version)"
          npm_version="$(npm --version)"

          echo "Node: ${node_version}"
          echo "npm: ${npm_version}"

          [[ "${node_version}" == v24.* ]]
          [[ "${npm_version}" == "11.9.0" ]]

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package contract immutability
        run: git diff --exit-code -- package.json package-lock.json

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Determine DB-backed build availability
        id: prerender
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${CI_DATABASE_URL:-}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "CI_DATABASE_URL detected."
            echo "DB-backed Next.js prerender build will run."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"

            echo "::notice title=DB-backed build skipped::CI_DATABASE_URL is not configured. Lint and typecheck remain mandatory. Production build is validated by Vercel."
          fi

      - name: Build
        if: steps.prerender.outputs.enabled == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          set -euo pipefail
          npm run build

      - name: Report skipped build
        if: steps.prerender.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "DB-backed Next.js build was skipped because CI_DATABASE_URL is not configured."
          echo "This is expected for the current CI environment."
          echo "Lint and typecheck were still enforced."
          echo "Vercel remains the production build/deployment authority."
